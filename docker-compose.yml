services:
  backend:
    build: .
    image: thich24hutm-be:local
    container_name: thich24hutm-be
    restart: unless-stopped
    environment:
      PORT: '3001'
      # Phase 2: the single shared database (thich24h_notify). Schema is owned
      # by thich24h_notify's Alembic; never run BE migrations against it.
      DATABASE_URL: postgresql://thich24h:thich24h@host.docker.internal:5432/thich24h_notify
      ZALO_APP_ID: ${ZALO_APP_ID:?set ZALO_APP_ID in .env}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:?set ZALO_APP_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MAX_STORE_DISTANCE_METERS: ${MAX_STORE_DISTANCE_METERS:-50}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - default
      - thich24h_edge

  proxy:
    image: nginx:alpine
    container_name: thich24hutm-proxy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro

  tunnel:
    image: ngrok/ngrok:latest
    container_name: thich24hutm-ngrok
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN}
    command: http http://proxy:8080 --url=exemption-mountain-repossess.ngrok-free.dev

networks:
  thich24h_edge:
    external: true
